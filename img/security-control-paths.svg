<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="650"
  viewBox="0 0 1200 650"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">EOEPCA security control paths</title>
  <desc id="description">
    Workload specifications are checked by Pod Security Admission, Kyverno,
    and Trivy. User requests enter through APISIX, which uses Keycloak identity
    and OPA authorization before forwarding an allowed request. Both paths
    produce evidence for the monitoring and response tools.
  </desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="8"
        flood-color="#173042"
        flood-opacity="0.10"
      />
    </filter>
    <marker
      id="arrow"
      markerWidth="14"
      markerHeight="14"
      refX="12"
      refY="7"
      orient="auto"
      markerUnits="userSpaceOnUse"
      viewBox="0 0 14 14"
    >
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#53758a" />
    </marker>
  </defs>

  <rect
    x="8"
    y="8"
    width="1184"
    height="634"
    rx="32"
    fill="#f6f9fb"
    stroke="#dce6ec"
    stroke-width="2"
  />

  <text
    x="60"
    y="52"
    fill="#496574"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="2.2"
  >
    SECURITY CONTROLS AND OPERATOR EVIDENCE
  </text>

  <text
    x="60"
    y="93"
    fill="#167a9f"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1.4"
  >
    WORKLOAD SECURITY
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="112" width="190" height="86" rx="18" fill="#ffffff" />
    <rect x="310" y="112" width="190" height="86" rx="18" fill="#ffffff" />
    <rect x="560" y="100" width="265" height="110" rx="18" fill="#ffffff" />
    <rect x="885" y="100" width="255" height="110" rx="18" fill="#ffffff" />
  </g>

  <text x="155" y="148" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">Workload spec</text>
  <text x="155" y="174" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">defines Pod settings</text>

  <text x="405" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Pod Security</text>
  <text x="405" y="160" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Admission</text>
  <text x="405" y="184" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">checks new Pods</text>

  <text x="692.5" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">Kyverno</text>
  <text x="692.5" y="164" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">checks policy in background</text>
  <text x="692.5" y="187" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">and creates reports</text>

  <text x="1012.5" y="137" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">Trivy Operator</text>
  <text x="1012.5" y="164" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">scans deployed resources</text>
  <text x="1012.5" y="187" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">and creates reports</text>

  <path d="M262 155 H292" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M512 155 H542" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M837 155 H867" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

  <text
    x="60"
    y="265"
    fill="#5b58a5"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1.4"
  >
    USER REQUEST
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="284" width="190" height="86" rx="18" fill="#ffffff" />
    <rect x="330" y="272" width="260" height="110" rx="18" fill="#ffffff" />
    <rect x="650" y="272" width="220" height="110" rx="18" fill="#eeedfb" />
    <rect x="930" y="284" width="210" height="86" rx="18" fill="#ffffff" />
  </g>

  <text x="155" y="320" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">External request</text>
  <text x="155" y="346" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">enters the public route</text>

  <text x="460" y="309" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">APISIX gateway</text>
  <text x="460" y="336" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">intercepts and enforces</text>
  <text x="460" y="359" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">the access decision</text>

  <text x="760" y="307" text-anchor="middle" fill="#4d4a91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Keycloak: identity</text>
  <text x="760" y="336" text-anchor="middle" fill="#4d4a91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">OPA: allow or deny</text>
  <text x="760" y="361" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">supports the gateway decision</text>

  <text x="1035" y="320" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">EOEPCA service</text>
  <text x="1035" y="346" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">receives allowed traffic</text>

  <path d="M262 327 H312" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M602 327 H632" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M882 327 H912" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

  <rect
    x="375"
    y="410"
    width="450"
    height="38"
    rx="19"
    fill="#e6f3ed"
  />
  <text
    x="600"
    y="435"
    text-anchor="middle"
    fill="#287b5b"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="13"
    font-weight="800"
    letter-spacing="1.1"
  >
    BOTH CONTROL PATHS PRODUCE OPERATOR EVIDENCE
  </text>

  <text
    x="60"
    y="468"
    fill="#2f8c67"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="1.4"
  >
    EVIDENCE AND RESPONSE
  </text>

  <g filter="url(#shadow)">
    <rect x="300" y="482" width="260" height="104" rx="18" fill="#ffffff" />
    <rect x="610" y="482" width="260" height="104" rx="18" fill="#ffffff" />
    <rect x="920" y="482" width="220" height="104" rx="18" fill="#ffffff" />
  </g>

  <text x="430" y="522" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Policy, scan, and</text>
  <text x="430" y="548" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">request evidence</text>
  <text x="430" y="572" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">supports investigation</text>

  <text x="740" y="522" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Prometheus, Loki,</text>
  <text x="740" y="548" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">and Grafana</text>
  <text x="740" y="572" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">detect and present evidence</text>

  <text x="1030" y="522" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">Alertmanager</text>
  <text x="1030" y="548" text-anchor="middle" fill="#173042" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750">and Keep</text>
  <text x="1030" y="572" text-anchor="middle" fill="#5b7481" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">route the response</text>

  <path d="M572 534 H592" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M882 534 H902" fill="none" stroke="#53758a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
</svg>
